services:
  localstack:
    # Pinned to the credential-free community generation for fully offline tests.
    # Terraform still creates current, standard AWS resources for real deploys.
    image: localstack/localstack:3.8.1
    container_name: replica-ingestion-localstack
    ports:
      - "4566:4566"
    environment:
      DEBUG: "${LOCALSTACK_DEBUG:-0}"
      DOCKER_HOST: unix:///var/run/docker.sock
      PERSISTENCE: "0"
      SERVICES: dynamodb,dynamodbstreams,events,iam,lambda,logs,sqs,sts
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
      POSTGRES_DB: mirror
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  localstack-data:
  qdrant-data:
  postgres-data:
