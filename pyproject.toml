[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-whatsapp"
version = "0.1.0"
description = "Review-first WhatsApp persona and conversation memory indexing"
requires-python = ">=3.11"
dependencies = [
  "qdrant-client[fastembed]>=1.19,<1.20",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
generation = ["openai>=1,<3"]
topic-local = ["mlx-vlm>=0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["whatsapp*"]
